name: Release to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      test_pypi_only:
        description: 'Publish to TestPyPI only'
        required: false
        type: boolean
        default: false
      test_docker:
        description: 'Build & push the Docker image (tagged :test) without running PyPI publish — use to verify Docker Hub / GHCR credentials'
        required: false
        type: boolean
        default: false
      mcp_registry_version:
        description: 'Publish server.json to the MCP registry for this version, which must be on PyPI already (for example 0.2.43). Use it to retry a registry publish that failed during a release.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build package
        run: uv build

      - name: Store the distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-to-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.test_pypi_only
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/cocoindex-code
    permissions:
      id-token: write
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-to-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cocoindex-code
    permissions:
      id-token: write
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Upload distribution to GitHub Release
    needs:
      - publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Upload distributions to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          gh release upload
          '${{ github.ref_name }}' dist/*
          --repo '${{ github.repository }}'

  publish-to-mcp-registry:
    name: Publish server.json to the MCP registry
    # The registry stores metadata only. On publish it reads this version from
    # PyPI and checks that the README there carries the line
    # `mcp-name: io.github.cocoindex-io/cocoindex-code`, so this job runs after
    # the PyPI upload. Nothing else depends on it: a failure here leaves the
    # PyPI, GitHub Release and Docker jobs untouched, and
    # `mcp_registry_version` on a manual run retries it.
    #
    # A GitHub pre-release is skipped. A PEP 440 pre-release version such as
    # `0.3.0rc1` is not semantic versioning, and the registry marks every
    # version it cannot parse as "latest".
    if: >-
      ${{
        !cancelled() && !failure() && (
          (github.event_name == 'release' && !github.event.release.prerelease)
          || (github.event_name == 'workflow_dispatch' && inputs.mcp_registry_version != '')
        )
      }}
    needs:
      - publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # GitHub OIDC proves that this workflow runs in the `cocoindex-io`
      # organization, which grants the `io.github.cocoindex-io/*` namespace.
      # No stored secret.
      id-token: write
    env:
      # Pinned on purpose. To upgrade, set the new release tag here; the
      # download step verifies the Sigstore bundle of that tag.
      MCP_PUBLISHER_VERSION: v1.8.7
    steps:
      - uses: actions/checkout@v4

      - name: Set the version in server.json
        # server.json in the repository holds the placeholder `0.0.0`, because
        # the package version comes from the git tag (hatch-vcs). A release
        # uses its tag (`v0.2.43` -> `0.2.43`); a manual run uses the input.
        env:
          INPUT_VERSION: ${{ inputs.mcp_registry_version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
              version="${GITHUB_REF_NAME#v}"
          else
              version="${INPUT_VERSION#v}"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::'$version' is not a MAJOR.MINOR.PATCH version"
              exit 1
          fi
          jq --arg v "$version" '.version = $v | .packages[].version = $v' server.json > server.tmp
          mv server.tmp server.json
          echo "VERSION=$version" >> "$GITHUB_ENV"
          cat server.json

      - name: Wait for the version on PyPI
        # A new version can take a while to show up in the PyPI JSON API (see
        # the note on v0.2.24 in the Docker job). The registry reads the same
        # API, so wait until the version is there with the ownership marker.
        run: |
          set -euo pipefail
          name="$(jq -r '.name' server.json)"
          package="$(jq -r '.packages[0].identifier' server.json)"
          url="https://pypi.org/pypi/${package}/${VERSION}/json"
          for attempt in $(seq 1 30); do
              if curl --fail --silent --location "$url" --output pypi.json; then
                  if jq -e --arg marker "mcp-name: ${name}" \
                      '.info.description | contains($marker)' pypi.json >/dev/null; then
                      echo "${package} ${VERSION} is on PyPI with the marker 'mcp-name: ${name}'."
                      exit 0
                  fi
                  echo "::error::${package} ${VERSION} is on PyPI, but its README has no 'mcp-name: ${name}' line."
                  exit 1
              fi
              echo "Attempt ${attempt}: ${package} ${VERSION} is not on PyPI yet. Next try in 20 s."
              sleep 20
          done
          echo "::error::${package} ${VERSION} did not show up on PyPI within 10 minutes."
          exit 1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Validate server.json
        run: ./mcp-publisher validate server.json

      - name: Log in to the MCP registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json to the MCP registry
        run: ./mcp-publisher publish server.json

  publish-docker:
    name: Build & push Docker image (${{ matrix.variant }})
    # Runs on real releases, and on manual dispatch with `test_docker=true`
    # for verifying registry credentials before the first release.
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.test_docker)
    runs-on: ubuntu-latest
    environment:
      name: docker-hub
      url: https://hub.docker.com/r/cocoindex/cocoindex-code
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # slim (default) — LiteLLM-only, ~300 MB. Publishes as `:latest`.
          - variant: slim
            install_spec: /ccc-src
          # full — bundles sentence-transformers + torch + baked model,
          # ~2 GB. Publishes as `:full`.
          - variant: full
            install_spec: /ccc-src[full]
    steps:
      - uses: actions/checkout@v4

      # QEMU lets buildx cross-compile linux/arm64 on the x86_64 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        # Tag scheme:
        #   slim on release:  :latest, :<version>
        #   full on release:  :full,   :<version>-full
        #   slim on dispatch: :test
        #   full on dispatch: :test-full
        # Dispatched tags stay out of the `:latest` / `:<version>` namespace
        # so manual test runs don't clobber what users pull.
        run: |
          variant="${{ matrix.variant }}"
          if [ "$variant" = "slim" ]; then
              slim_suffix=""
          else
              slim_suffix="-$variant"
          fi
          if [ "${{ github.event_name }}" = "release" ]; then
              version="${{ github.ref_name }}"
              if [ "$variant" = "slim" ]; then
                  latest_tag="latest"
              else
                  latest_tag="$variant"
              fi
              {
                  echo "tags<<EOF"
                  echo "cocoindex/cocoindex-code:${latest_tag}"
                  echo "cocoindex/cocoindex-code:${version}${slim_suffix}"
                  echo "ghcr.io/cocoindex-io/cocoindex-code:${latest_tag}"
                  echo "ghcr.io/cocoindex-io/cocoindex-code:${version}${slim_suffix}"
                  echo "EOF"
              } >> "$GITHUB_OUTPUT"
          else
              test_tag="test${slim_suffix}"
              {
                  echo "tags<<EOF"
                  echo "cocoindex/cocoindex-code:${test_tag}"
                  echo "ghcr.io/cocoindex-io/cocoindex-code:${test_tag}"
                  echo "EOF"
              } >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push to both registries
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          # Native amd64 for Linux servers + Intel Macs; arm64 (cross-compiled
          # via QEMU) for Apple Silicon Macs and arm64 Linux hosts.
          platforms: linux/amd64,linux/arm64
          # Install cocoindex-code from the checked-out source tree, not PyPI.
          # Avoids a race where a just-published version hasn't propagated to
          # PyPI's CDN yet (which happened on v0.2.24 release), and ensures
          # the image matches the tagged commit byte-for-byte.
          build-args: |
            CCC_VARIANT=${{ matrix.variant }}
            CCC_INSTALL_SPEC=${{ matrix.install_spec }}
          tags: ${{ steps.tags.outputs.tags }}
          # Per-variant BuildKit cache so slim and full don't evict each
          # other's layers. The heavy `deps` layer (torch + friends for
          # full; empty for slim) reuses across releases.
          # Registry-backed BuildKit cache, stored as a separate tag
          # (`buildcache-<variant>`) on the same GHCR package. Independent of
          # branch/tag, so cache reuses across releases (every release tag is
          # a different ref, which would have made GHA-scoped caching miss).
          # `mode=max` exports all layers, including intermediate ones.
          cache-from: type=registry,ref=ghcr.io/cocoindex-io/cocoindex-code:buildcache-${{ matrix.variant }}
          cache-to: type=registry,ref=ghcr.io/cocoindex-io/cocoindex-code:buildcache-${{ matrix.variant }},mode=max
